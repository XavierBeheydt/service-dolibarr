name: dolibarr

volumes:
    db-data:


services:
    db:
        image: mariadb:latest
        restart: always
        env_file: .env
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - private
        labels:
            - traefik.enable=false

    # web:
    #     depends_on:
    #         - db
    #     image: tuxgasy/dolibarr:${DOLI_TAG}
    #     env_file: .env
    #     restart: always
    #     links:
    #         - db
    #     volumes:
    #         - ${DOLI_DATA_DOCUMENTS}:/var/www/documents
    #         - ${DOLI_DATA_CUSTOM}:/var/www/html/custom
    #     networks:
    #         - private
    #     labels:
    #         - traefik.http.routers.dolibarr.entrypoints=websecure
    #         - traefik.http.routers.dolibarr.rule=Host(`broska.hd.free.fr`) && PathPrefix(`/crm`)
    #         - traefik.http.routers.dolibarr.tls.certresolver=letsencrypt
    #         - traefik.http.middlewares.dolibarr-strip.stripprefix.prefixes=/crm
    #         - traefik.http.routers.dolibarr.middlewares=dolibarr-strip
    #         - traefik.http.services.dolibarr.loadbalancer.server.port=80

    web:
        build:
            context: .
            dockerfile: Dockerfile
        image: dolibarr-custom:${DOLI_TAG}
        depends_on:
            - db
        links:
            - db
        env_file: .env
        restart: always
        volumes:
            - ${DOLI_DATA_DOCUMENTS}:/var/www/documents
            - ${DOLI_DATA_CUSTOM}:/var/www/html/custom
        environment:
            DOLI_INIT_DEMO: ${DOLI_INIT_DEMO:-0}
            DOLI_INSTALL_AUTO: ${DOLI_INSTALL_AUTO:-1}
            DOLI_DB_HOST: ${DOLI_DB_HOST:-db}
            DOLI_DB_NAME: ${DOLI_DB_NAME:-dolidb}
            DOLI_DB_USER: ${DOLI_DB_USER:-dolidbuser}
            DOLI_DB_PASSWORD: ${DOLI_DB_PASSWORD:-dolidbpass}
            DOLI_URL_ROOT: "${DOLI_URL_ROOT:-http://0.0.0.0}"
            DOLI_ADMIN_LOGIN: "${DOLI_ADMIN_LOGIN:-admin}"
            DOLI_ADMIN_PASSWORD: "${DOLI_ADMIN_PASSWORD:-admin}"
            DOLI_CRON: ${DOLI_CRON:-0}
            WWW_USER_ID: ${WWW_USER_ID:-1000}
            WWW_GROUP_ID: ${WWW_GROUP_ID:-1000}
        networks:
            - private
        labels:
            - traefik.http.routers.dolibarr.entrypoints=websecure
            - traefik.http.routers.dolibarr.rule=Host(`broska.hd.free.fr`) && PathPrefix(`/crm`)
            - traefik.http.routers.dolibarr.tls.certresolver=letsencrypt

networks:
    private:
        external: true