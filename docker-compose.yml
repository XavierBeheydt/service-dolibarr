name: dolibarr

volumes:
    db-data:


services:
    db:
        image: mariadb:latest
        restart: always
        env_file:
            - .env/mariadb.env
        volumes:
            - db-data:/var/lib/mysql

    web:
        depends_on:
            - db
        image: tuxgasy/dolibarr:${DOLI_TAG}
        env_file:
            - .env/dolibarr.env
        restart: always
        ports:
            - ${DOLI_PORT}:80
        links:
            - db
        volumes:
            - ${DOLI_DATA_DOCUMENTS}:/var/www/documents
            - ${DOLI_DATA_CUSTOM}:/var/www/html/custom
